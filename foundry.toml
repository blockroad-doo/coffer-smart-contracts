[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
ffi = true  # Enable FFI for deployment scripts to update .env file
unchecked_cheatcode_artifacts = true  # we need this so test can run older solc verions (0.6.11 for DepositContract.sol)
no_match_coverage = "^test/|^script/|^integration/"
no_match_path =  "test/{invariant,integration}/*" #comment this line if wan to test invariants with -> forge test --mp "test/invariant/*"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "solady/=lib/solady/src/"]
ignored_error_codes = [4591, 2424] #openzeppelin warnings cause too many warnings which have to be ignored

[lint]
ignore = ["test/**/*.sol", "script/**/*.sol"] # mirror slither.config.json filter_paths. The glob needs the file component, a bare "**" matches nothing
# first three mirror the slither.config.json triage; arbitrary-send-eth is the product (bond/fee payouts to
# holder/validator chosen addresses, slither's own detector still covers src); missing-events-access-control
# on the CofferBondNft setters would be an ABI change, a product decision, not a lint fix
exclude_lints = ["reentrancy-events", "calls-loop", "missing-zero-check", "arbitrary-send-eth", "missing-events-access-control"]


[fuzz]
runs = 1024

[invariant]
runs = 512
depth = 64
fail_on_revert = false

[profile.strict.invariant]
runs = 512
depth = 64
fail_on_revert = true

[profile.ci]
no_match_path = "test/invariant/*"

