name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: false

      - name: Install solhint
        run: npm i -g solhint

      - name: Run lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: false

      - name: Ensure solc available
        run: |
          SOLC_VERSION=$(grep -m1 'pragma solidity' src/Coffer.sol | grep -oP '\d+\.\d+\.\d+')
          SVM_DIR="${HOME}/.local/share/svm"
          if [ ! -f "${SVM_DIR}/${SOLC_VERSION}/solc-${SOLC_VERSION}" ]; then
            SOLC_FILE=$(curl -s https://binaries.soliditylang.org/linux-amd64/list.json | jq -r ".releases[\"${SOLC_VERSION}\"]")
            mkdir -p "${SVM_DIR}/${SOLC_VERSION}"
            curl -L "https://binaries.soliditylang.org/linux-amd64/${SOLC_FILE}" \
              -o "${SVM_DIR}/${SOLC_VERSION}/solc-${SOLC_VERSION}"
            chmod +x "${SVM_DIR}/${SOLC_VERSION}/solc-${SOLC_VERSION}"
          fi

      - name: Build
        run: forge build --sizes --deny warnings

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: false

      - name: Ensure solc available
        run: |
          SOLC_VERSION=$(grep -m1 'pragma solidity' src/Coffer.sol | grep -oP '\d+\.\d+\.\d+')
          SVM_DIR="${HOME}/.local/share/svm"
          if [ ! -f "${SVM_DIR}/${SOLC_VERSION}/solc-${SOLC_VERSION}" ]; then
            SOLC_FILE=$(curl -s https://binaries.soliditylang.org/linux-amd64/list.json | jq -r ".releases[\"${SOLC_VERSION}\"]")
            mkdir -p "${SVM_DIR}/${SOLC_VERSION}"
            curl -L "https://binaries.soliditylang.org/linux-amd64/${SOLC_FILE}" \
              -o "${SVM_DIR}/${SOLC_VERSION}/solc-${SOLC_VERSION}"
            chmod +x "${SVM_DIR}/${SOLC_VERSION}/solc-${SOLC_VERSION}"
          fi

      - name: Build for Slither
        run: forge build --build-info --skip test script

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          fail-on: low

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      HOODI_RPC_URL: ${{ secrets.HOODI_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: false

      - name: Ensure solc available
        run: |
          SOLC_VERSION=$(grep -m1 'pragma solidity' src/Coffer.sol | grep -oP '\d+\.\d+\.\d+')
          SVM_DIR="${HOME}/.local/share/svm"
          if [ ! -f "${SVM_DIR}/${SOLC_VERSION}/solc-${SOLC_VERSION}" ]; then
            SOLC_FILE=$(curl -s https://binaries.soliditylang.org/linux-amd64/list.json | jq -r ".releases[\"${SOLC_VERSION}\"]")
            mkdir -p "${SVM_DIR}/${SOLC_VERSION}"
            curl -L "https://binaries.soliditylang.org/linux-amd64/${SOLC_FILE}" \
              -o "${SVM_DIR}/${SOLC_VERSION}/solc-${SOLC_VERSION}"
            chmod +x "${SVM_DIR}/${SOLC_VERSION}/solc-${SOLC_VERSION}"
          fi

      - name: Set weekly fuzz seed
        run: >
          echo "FOUNDRY_FUZZ_SEED=$(
            echo $(($EPOCHSECONDS / 604800))
          )" >> $GITHUB_ENV

      - name: Build
        run: forge build

      - name: Run local tests
        run: >
          FOUNDRY_PROFILE=ci forge test
          --no-match-contract RefundMarginalGasTest
          --isolate
          -vvv
          --show-progress

      - name: Run Hoodi fork tests
        if: env.HOODI_RPC_URL != ''
        run: >
          HOODI_RPC_URL=${{ secrets.HOODI_RPC_URL }} forge test
          --no-match-contract RefundMarginalGasTest
          --match-path "test/integration/hoodi/*"
          -vvv

      - name: Coverage
        run: >
          forge coverage
          --no-match-coverage "^test/|^script/"
          --no-match-test "MarginalRefundBranchGas"
          --report summary
